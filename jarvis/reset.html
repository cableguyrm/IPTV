<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updating Jarvis</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04080f;color:#8ff0ff;font:16px system-ui,sans-serif}</style>
</head><body><p id="m">Updating Jarvis…</p>
<script>
// Removes old cached copies of the app (not the downloaded AI models) and reloads fresh.
(async () => {
  try {
    for (const r of (await navigator.serviceWorker?.getRegistrations?.()) || []) await r.unregister();
    for (const k of await caches.keys()) if (k.startsWith("jarvis-")) await caches.delete(k);
  } catch (e) { document.getElementById("m").textContent = "Update failed: " + e.message; return; }
  location.replace("./?fresh=" + Date.now());
})();
</script></body></html>
